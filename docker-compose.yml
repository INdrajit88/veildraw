version: '3.8'

services:
  proof-server:
    image: midnightntwrk/proof-server:8.1.0
    container_name: pgp-proof-server
    ports:
      - "6300:6300"
    environment:
      - PORT=6300
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6300/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgp-ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: pgp-web-ui
    ports:
      - "8080:80"
    depends_on:
      proof-server:
        condition: service_healthy
    restart: unless-stopped
